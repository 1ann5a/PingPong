<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de Links Externos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 24px;
        }

        p {
            color: #aaa;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 320px;
        }

        a {
            display: block;
            padding: 15px 20px;
            background-color: #1e88e5;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
            transition: background 0.2s;
        }

        a:active {
            background-color: #1565c0;
        }

        .blank-link {
            background-color: #43a047;
        }

        .blank-link:active {
            background-color: #2e7d32;
        }
    </style>
</head>
<body>

    <h1>Teste de WebView</h1>
    <p>Clique nos links abaixo para verificar se continuam dentro do app:</p>

    <div class="links-container">
        <!-- Link simples padrão -->
        <a href="https://www.google.com">Abrir Google (Mesma Aba)</a>

        <!-- Link externo com target _blank (nova aba) -->
        <a href="https://www.wikipedia.org" target="_blank" class="blank-link">Abrir Wikipédia (Target _blank)</a>

        <!-- Link para site de mídia -->
        <a href="https://www.youtube.com">Abrir YouTube</a>
    </div>

</body>
</html>
