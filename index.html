<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pong - HTML Game</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background:
                radial-gradient(circle at center, #18212f 0%, #080b12 70%);
            font-family: Arial, sans-serif;
            color: white;
            overflow: hidden;
        }

        .game-container {
            width: min(1000px, 95vw);
            text-align: center;
        }

        h1 {
            margin-bottom: 12px;
            font-size: 42px;
            letter-spacing: 8px;
            text-shadow: 0 0 15px rgba(255,255,255,.5);
        }

        .game-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding: 0 15px;
            color: #aab4c4;
            font-size: 14px;
        }

        .game-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #080c13;
            border: 2px solid #344052;
            border-radius: 12px;
            overflow: hidden;
            box-shadow:
                0 0 30px rgba(0, 0, 0, .7),
                inset 0 0 30px rgba(255,255,255,.02);
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(5, 8, 13, .72);
            backdrop-filter: blur(4px);
        }

        .overlay.hidden {
            display: none;
        }

        .overlay h2 {
            font-size: 36px;
            margin-bottom: 10px;
        }

        .overlay p {
            color: #aab4c4;
            margin-bottom: 22px;
        }

        button {
            border: none;
            padding: 13px 30px;
            border-radius: 8px;
            background: white;
            color: #080b12;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: .2s;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255,255,255,.3);
        }

        .controls {
            margin-top: 14px;
            display: flex;
            justify-content: center;
            gap: 35px;
            color: #8d99aa;
            font-size: 13px;
        }

        .key {
            display: inline-block;
            padding: 3px 7px;
            border: 1px solid #414b5c;
            border-radius: 4px;
            background: #151b25;
            color: white;
            margin: 0 2px;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 28px;
            }

            .controls {
                flex-direction: column;
                gap: 5px;
            }
        }
    </style>
</head>

<body>

<div class="game-container">

    <h1>PONG</h1>

    <div class="game-info">
        <span>PLAYER 1</span>
        <span>PLAYER 2</span>
    </div>

    <div class="game-wrapper">

        <canvas id="gameCanvas"></canvas>

        <div class="overlay" id="overlay">
            <h2 id="overlayTitle">PONG</h2>
            <p id="overlayText">Primeiro jogador a chegar a 7 pontos vence.</p>
            <button id="startButton">COMEÇAR</button>
        </div>

    </div>

    <div class="controls">
        <span>
            Jogador 1:
            <span class="key">W</span>
            <span class="key">S</span>
        </span>

        <span>
            Jogador 2:
            <span class="key">↑</span>
            <span class="key">↓</span>
        </span>

        <span>
            <span class="key">ESPAÇO</span> Pausar
        </span>

        <span>
            <span class="key">R</span> Reiniciar
        </span>
    </div>

</div>

<script>

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

const overlay = document.getElementById("overlay");
const overlayTitle = document.getElementById("overlayTitle");
const overlayText = document.getElementById("overlayText");
const startButton = document.getElementById("startButton");

let width;
let height;

function resizeCanvas() {
    const rect = canvas.getBoundingClientRect();

    const scale = window.devicePixelRatio || 1;

    canvas.width = rect.width * scale;
    canvas.height = rect.height * scale;

    ctx.setTransform(scale, 0, 0, scale, 0, 0);

    width = rect.width;
    height = rect.height;
}

window.addEventListener("resize", resizeCanvas);

resizeCanvas();


// ============================
// CONFIGURAÇÕES
// ============================

const WIN_SCORE = 7;

const paddle = {
    width: 14,
    height: 100,
    speed: 7
};

const ball = {
    size: 14,
    speed: 6,
    x: 0,
    y: 0,
    vx: 0,
    vy: 0
};

let player1 = {
    x: 30,
    y: 0,
    score: 0
};

let player2 = {
    x: 0,
    y: 0,
    score: 0
};

let keys = {};

let gameRunning = false;
let gamePaused = false;


// ============================
// POSIÇÕES
// ============================

function resetPositions() {

    player1.x = 30;
    player1.y = height / 2 - paddle.height / 2;

    player2.x = width - 30 - paddle.width;
    player2.y = height / 2 - paddle.height / 2;

    resetBall();
}


// ============================
// BOLA
// ============================

function resetBall(direction = Math.random() > .5 ? 1 : -1) {

    ball.x = width / 2 - ball.size / 2;
    ball.y = height / 2 - ball.size / 2;

    const angle = (Math.random() * 0.8 - 0.4);

    ball.speed = 6;

    ball.vx = direction * ball.speed;
    ball.vy = angle * ball.speed;
}


// ============================
// TECLADO
// ============================

document.addEventListener("keydown", (event) => {

    keys[event.key.toLowerCase()] = true;

    if (
        event.key === "ArrowUp" ||
        event.key === "ArrowDown" ||
        event.code === "Space"
    ) {
        event.preventDefault();
    }

    if (event.code === "Space") {

        if (gameRunning) {
            gamePaused = !gamePaused;
        }
    }

    if (event.key.toLowerCase() === "r") {
        restartGame();
    }
});

document.addEventListener("keyup", (event) => {
    keys[event.key.toLowerCase()] = false;
});


// ============================
// MOVIMENTO DOS JOGADORES
// ============================

function updatePaddles() {

    // Jogador 1

    if (keys["w"]) {
        player1.y -= paddle.speed;
    }

    if (keys["s"]) {
        player1.y += paddle.speed;
    }


    // Jogador 2

    if (keys["arrowup"]) {
        player2.y -= paddle.speed;
    }

    if (keys["arrowdown"]) {
        player2.y += paddle.speed;
    }


    // Limites

    player1.y = Math.max(
        0,
        Math.min(height - paddle.height, player1.y)
    );

    player2.y = Math.max(
        0,
        Math.min(height - paddle.height, player2.y)
    );
}


// ============================
// IA OPCIONAL
// ============================

// Atualmente o segundo jogador é controlado
// pelas setas.

// Para transformar o Player 2 em computador,
// descomente a função abaixo e chame-a em update().

/*

    const center = player2.y + paddle.height / 2;

    if (center < ball.y) {
        player2.y += 4;
    }

    if (center > ball.y) {
        player2.y -= 4;
    }

    player2.y = Math.max(
        0,
        Math.min(height - paddle.height, player2.y)
    );
}
*/


// ============================
// COLISÃO
// ============================

function collision(ball, paddle) {

    return (
        ball.x < paddle.x + paddle.width &&
        ball.x + ball.size > paddle.x &&
        ball.y < paddle.y + paddle.height &&
        ball.y + ball.size > paddle.y
    );
}


// ============================
// MOVIMENTO DA BOLA
// ============================

function updateBall() {

    ball.x += ball.vx;
    ball.y += ball.vy;


    // Parede superior

    if (ball.y <= 0) {

        ball.y = 0;
        ball.vy *= -1;
    }


    // Parede inferior

    if (ball.y + ball.size >= height) {

        ball.y = height - ball.size;
        ball.vy *= -1;
    }


    // Raquete jogador 1

    if (collision(ball, player1) && ball.vx < 0) {

        ball.x = player1.x + paddle.width;

        const hitPosition =
            (ball.y + ball.size / 2) -
            (player1.y + paddle.height / 2);

        const normalized =
            hitPosition / (paddle.height / 2);

        ball.vx = Math.abs(ball.vx) + 0.3;
        ball.vy = normalized * 6;
    }


    // Raquete jogador 2

    if (collision(ball, player2) && ball.vx > 0) {

        ball.x = player2.x - ball.size;

        const hitPosition =
            (ball.y + ball.size / 2) -
            (player2.y + paddle.height / 2);

        const normalized =
            hitPosition / (paddle.height / 2);

        ball.vx = -Math.abs(ball.vx) - 0.3;
        ball.vy = normalized * 6;
    }


    // Ponto jogador 2

    if (ball.x < -ball.size) {

        player2.score++;

        checkWinner();

        if (gameRunning) {
            resetBall(-1);
        }
    }


    // Ponto jogador 1

    if (ball.x > width) {

        player1.score++;

        checkWinner();

        if (gameRunning) {
            resetBall(1);
        }
    }
}


// ============================
// VENCEDOR
// ============================

function checkWinner() {

    if (player1.score >= WIN_SCORE) {

        endGame("PLAYER 1 VENCEU!");
    }

    if (player2.score >= WIN_SCORE) {

        endGame("PLAYER 2 VENCEU!");
    }
}


function endGame(message) {

    gameRunning = false;

    overlayTitle.textContent = message;
    overlayText.textContent =
        `Placar final: ${player1.score} × ${player2.score}`;

    startButton.textContent = "JOGAR NOVAMENTE";

    overlay.classList.remove("hidden");
}


// ============================
// DESENHO
// ============================

function drawBackground() {

    ctx.fillStyle = "#080c13";

    ctx.fillRect(0, 0, width, height);


    // Linha central

    ctx.setLineDash([10, 15]);

    ctx.strokeStyle = "#283241";
    ctx.lineWidth = 2;

    ctx.beginPath();

    ctx.moveTo(width / 2, 0);
    ctx.lineTo(width / 2, height);

    ctx.stroke();

    ctx.setLineDash([]);


    // Placar

    ctx.font = "bold 70px Arial";
    ctx.textAlign = "center";
    ctx.fillStyle = "#202938";

    ctx.fillText(
        player1.score,
        width / 2 - 70,
        85
    );

    ctx.fillText(
        player2.score,
        width / 2 + 70,
        85
    );
}


function drawPaddle(x, y) {

    ctx.fillStyle = "#ffffff";

    ctx.beginPath();

    ctx.roundRect(
        x,
        y,
        paddle.width,
        paddle.height,
        7
    );

    ctx.fill();
}


function drawBall() {

    ctx.fillStyle = "#ffffff";

    ctx.beginPath();

    ctx.arc(
        ball.x + ball.size / 2,
        ball.y + ball.size / 2,
        ball.size / 2,
        0,
        Math.PI * 2
    );

    ctx.fill();
}


function draw() {

    drawBackground();

    drawPaddle(
        player1.x,
        player1.y
    );

    drawPaddle(
        player2.x,
        player2.y
    );

    drawBall();
}


// ============================
// GAME LOOP
// ============================

function update() {

    if (gameRunning && !gamePaused) {

        updatePaddles();

        updateBall();

    }

    draw();

    requestAnimationFrame(update);
}


// ============================
// INICIAR
// ============================

function startGame() {

    if (player1.score >= WIN_SCORE ||
        player2.score >= WIN_SCORE) {

        player1.score = 0;
        player2.score = 0;

    }

    resetPositions();

    gameRunning = true;
    gamePaused = false;

    overlay.classList.add("hidden");
}


function restartGame() {

    player1.score = 0;
    player2.score = 0;

    resetPositions();

    gameRunning = false;
    gamePaused = false;

    overlayTitle.textContent = "PONG";
    overlayText.textContent =
        "Primeiro jogador a chegar a 7 pontos vence.";

    startButton.textContent = "COMEÇAR";

    overlay.classList.remove("hidden");
}


startButton.addEventListener("click", startGame);


// Inicialização

resetPositions();

update();

</script>

</body>
</html>
