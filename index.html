<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Pong</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background:
        radial-gradient(circle at center, #18212f, #06090f 75%);

    color: white;
    font-family: Arial, sans-serif;

    display: flex;
    justify-content: center;
    align-items: center;

    touch-action: none;
}

.game-container {
    width: min(1000px, 96vw);
    text-align: center;
}

/* =========================
   TÍTULO
========================= */

h1 {
    margin-bottom: 10px;

    font-size: clamp(28px, 5vw, 44px);

    letter-spacing: 8px;

    text-shadow:
        0 0 15px rgba(255,255,255,.5);
}

/* =========================
   INFO
========================= */

.game-info {
    display: flex;
    justify-content: space-between;

    padding: 0 15px;
    margin-bottom: 8px;

    color: #aab4c4;

    font-size: 13px;
}

/* =========================
   JOGO
========================= */

.game-wrapper {
    position: relative;

    width: 100%;

    aspect-ratio: 16 / 9;

    background: #080c13;

    border: 2px solid #344052;

    border-radius: 12px;

    overflow: hidden;

    box-shadow:
        0 0 30px rgba(0,0,0,.7),
        inset 0 0 30px rgba(255,255,255,.02);
}

canvas {
    display: block;

    width: 100%;
    height: 100%;

    touch-action: none;
}

/* =========================
   OVERLAY
========================= */

.overlay {
    position: absolute;

    inset: 0;

    display: flex;

    flex-direction: column;

    justify-content: center;
    align-items: center;

    background: rgba(5,8,13,.75);

    backdrop-filter: blur(5px);

    padding: 20px;

    z-index: 10;
}

.overlay.hidden {
    display: none;
}

.overlay h2 {
    font-size: clamp(25px, 7vw, 40px);

    margin-bottom: 10px;
}

.overlay p {
    color: #aab4c4;

    margin-bottom: 20px;

    font-size: 14px;
}

button {
    border: none;

    padding: 13px 30px;

    border-radius: 8px;

    background: white;

    color: #080b12;

    font-size: 15px;

    font-weight: bold;

    cursor: pointer;

    touch-action: manipulation;
}

button:active {
    transform: scale(.95);
}

/* =========================
   CONTROLES DESKTOP
========================= */

.controls {
    margin-top: 12px;

    display: flex;

    justify-content: center;

    gap: 25px;

    color: #8d99aa;

    font-size: 12px;
}

.key {
    display: inline-block;

    padding: 3px 7px;

    border: 1px solid #414b5c;

    border-radius: 4px;

    background: #151b25;

    color: white;

    margin: 0 2px;
}

/* =========================
   CONTROLES MOBILE
========================= */

.mobile-controls {
    display: none;

    justify-content: space-between;

    width: 100%;

    margin-top: 12px;

    gap: 15px;
}

.control-group {
    display: flex;

    gap: 8px;

    flex: 1;
}

.mobile-btn {
    flex: 1;

    height: 55px;

    border-radius: 10px;

    background: #151b25;

    border: 1px solid #3a4657;

    color: white;

    font-size: 22px;

    padding: 0;

    user-select: none;

    touch-action: none;
}

.mobile-btn:active {
    background: #293547;

    transform: scale(.96);
}

/* =========================
   CELULAR
========================= */

@media (max-width: 700px) {

    .game-container {
        width: 94vw;
    }

    h1 {
        margin-bottom: 5px;
    }

    .game-info {
        font-size: 11px;

        margin-bottom: 5px;
    }

    .game-wrapper {
        border-radius: 8px;
    }

    .controls {
        display: none;
    }

    .mobile-controls {
        display: flex;
    }

}

/* =========================
   CELULAR DEITADO
========================= */

@media (max-height: 500px) and (orientation: landscape) {

    .game-container {
        width: 82vw;
    }

    h1 {
        display: none;
    }

    .game-info {
        display: none;
    }

    .mobile-controls {
        margin-top: 5px;
    }

    .mobile-btn {
        height: 40px;
    }

}

</style>
</head>

<body>

<div class="game-container">

    <h1>PONG</h1>

    <div class="game-info">
        <span>PLAYER 1</span>
        <span>PLAYER 2</span>
    </div>

    <div class="game-wrapper">

        <canvas id="gameCanvas"></canvas>

        <div class="overlay" id="overlay">

            <h2 id="overlayTitle">
                PONG
            </h2>

            <p id="overlayText">
                Primeiro jogador a chegar a 7 pontos vence.
            </p>

            <button id="startButton">
                COMEÇAR
            </button>

        </div>

    </div>

    <!-- CONTROLES MOBILE -->

    <div class="mobile-controls">

        <div class="control-group">

            <button
                class="mobile-btn"
                id="p1Up">
                ▲
            </button>

            <button
                class="mobile-btn"
                id="p1Down">
                ▼
            </button>

        </div>

        <div class="control-group">

            <button
                class="mobile-btn"
                id="p2Up">
                ▲
            </button>

            <button
                class="mobile-btn"
                id="p2Down">
                ▼
            </button>

        </div>

    </div>

    <div class="controls">

        <span>
            P1:
            <span class="key">W</span>
            <span class="key">S</span>
        </span>

        <span>
            P2:
            <span class="key">↑</span>
            <span class="key">↓</span>
        </span>

        <span>
            <span class="key">ESPAÇO</span>
            Pausar
        </span>

        <span>
            <span class="key">R</span>
            Reiniciar
        </span>

    </div>

</div>


<script>

const canvas =
    document.getElementById("gameCanvas");

const ctx =
    canvas.getContext("2d");

const overlay =
    document.getElementById("overlay");

const overlayTitle =
    document.getElementById("overlayTitle");

const overlayText =
    document.getElementById("overlayText");

const startButton =
    document.getElementById("startButton");


let width;
let height;

let keys = {};

let gameRunning = false;
let gamePaused = false;

const WIN_SCORE = 7;


/* =========================
   CANVAS RESPONSIVO
========================= */

function resizeCanvas() {

    const rect =
        canvas.getBoundingClientRect();

    const dpr =
        Math.min(window.devicePixelRatio || 1, 2);

    canvas.width =
        rect.width * dpr;

    canvas.height =
        rect.height * dpr;

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

    width = rect.width;
    height = rect.height;

    paddle.height =
        Math.max(55, height * 0.22);

    paddle.width =
        Math.max(9, width * 0.014);

    player1.x =
        width * 0.035;

    player2.x =
        width -
        width * 0.035 -
        paddle.width;

}

window.addEventListener(
    "resize",
    resizeCanvas
);


/* =========================
   OBJETOS
========================= */

const paddle = {

    width: 12,

    height: 90,

    speed: 7

};


const ball = {

    size: 14,

    speed: 6,

    x: 0,

    y: 0,

    vx: 0,

    vy: 0

};


const player1 = {

    x: 30,

    y: 0,

    score: 0

};


const player2 = {

    x: 0,

    y: 0,

    score: 0

};


/* =========================
   RESET POSIÇÕES
========================= */

function resetPositions() {

    player1.x =
        width * 0.035;

    player2.x =
        width -
        width * 0.035 -
        paddle.width;

    player1.y =
        height / 2 -
        paddle.height / 2;

    player2.y =
        height / 2 -
        paddle.height / 2;

    resetBall();

}


/* =========================
   BOLA
========================= */

function resetBall(direction) {

    if (!direction) {

        direction =
            Math.random() > .5
            ? 1
            : -1;

    }

    ball.x =
        width / 2 -
        ball.size / 2;

    ball.y =
        height / 2 -
        ball.size / 2;

    ball.speed =
        Math.max(
            4.5,
            Math.min(width * .012, 8)
        );

    const angle =
        Math.random() * .8 - .4;

    ball.vx =
        direction *
        ball.speed;

    ball.vy =
        angle *
        ball.speed;

}


/* =========================
   TECLADO
========================= */

document.addEventListener(
    "keydown",
    event => {

        keys[event.key.toLowerCase()] =
            true;

        if (event.code === "Space") {

            event.preventDefault();

            if (gameRunning) {

                gamePaused =
                    !gamePaused;

            }

        }

        if (
            event.key.toLowerCase()
            === "r"
        ) {

            restartGame();

        }

    }
);


document.addEventListener(
    "keyup",
    event => {

        keys[event.key.toLowerCase()] =
            false;

    }
);


/* =========================
   CONTROLES TOUCH
========================= */

function setupTouchButton(
    id,
    key
) {

    const button =
        document.getElementById(id);

    button.addEventListener(
        "pointerdown",
        event => {

            event.preventDefault();

            keys[key] = true;

        }
    );

    button.addEventListener(
        "pointerup",
        event => {

            event.preventDefault();

            keys[key] = false;

        }
    );

    button.addEventListener(
        "pointerleave",
        () => {

            keys[key] = false;

        }
    );

    button.addEventListener(
        "pointercancel",
        () => {

            keys[key] = false;

        }
    );

}


setupTouchButton(
    "p1Up",
    "w"
);

setupTouchButton(
    "p1Down",
    "s"
);

setupTouchButton(
    "p2Up",
    "arrowup"
);

setupTouchButton(
    "p2Down",
    "arrowdown"
);


/* =========================
   RAQUETES
========================= */

function updatePaddles() {

    if (keys["w"]) {

        player1.y -=
            paddle.speed;

    }

    if (keys["s"]) {

        player1.y +=
            paddle.speed;

    }

    if (keys["arrowup"]) {

        player2.y -=
            paddle.speed;

    }

    if (keys["arrowdown"]) {

        player2.y +=
            paddle.speed;

    }

    player1.y =
        Math.max(
            0,
            Math.min(
                height - paddle.height,
                player1.y
            )
        );

    player2.y =
        Math.max(
            0,
            Math.min(
                height - paddle.height,
                player2.y
            )
        );

}


/* =========================
   COLISÃO
========================= */

function collision(
    ball,
    paddle
) {

    return (

        ball.x <
        paddle.x +
        paddle.width

        &&

        ball.x +
        ball.size >
        paddle.x

        &&

        ball.y <
        paddle.y +
        paddle.height

        &&

        ball.y +
        ball.size >
        paddle.y

    );

}


/* =========================
   BOLA
========================= */

function updateBall() {

    ball.x += ball.vx;

    ball.y += ball.vy;


    /* PAREDE SUPERIOR */

    if (ball.y <= 0) {

        ball.y = 0;

        ball.vy *= -1;

    }


    /* PAREDE INFERIOR */

    if (
        ball.y +
        ball.size >=
        height
    ) {

        ball.y =
            height -
            ball.size;

        ball.vy *= -1;

    }


    /* PLAYER 1 */

    if (
        collision(ball, player1)
        &&
        ball.vx < 0
    ) {

        ball.x =
            player1.x +
            paddle.width;

        const hit =
            (
                ball.y +
                ball.size / 2
            )
            -
            (
                player1.y +
                paddle.height / 2
            );

        const normalized =
            hit /
            (paddle.height / 2);

        ball.vx =
            Math.abs(ball.vx) +
            .2;

        ball.vy =
            normalized * 6;

    }


    /* PLAYER 2 */

    if (
        collision(ball, player2)
        &&
        ball.vx > 0
    ) {

        ball.x =
            player2.x -
            ball.size;

        const hit =
            (
                ball.y +
                ball.size / 2
            )
            -
            (
                player2.y +
                paddle.height / 2
            );

        const normalized =
            hit /
            (paddle.height / 2);

        ball.vx =
            -Math.abs(ball.vx) -
            .2;

        ball.vy =
            normalized * 6;

    }


    /* PONTO PLAYER 2 */

    if (
        ball.x <
        -ball.size
    ) {

        player2.score++;

        checkWinner();

        if (gameRunning) {

            resetBall(-1);

        }

    }


    /* PONTO PLAYER 1 */

    if (
        ball.x >
        width
    ) {

        player1.score++;

        checkWinner();

        if (gameRunning) {

            resetBall(1);

        }

    }

}


/* =========================
   VENCEDOR
========================= */

function checkWinner() {

    if (
        player1.score >=
        WIN_SCORE
    ) {

        endGame(
            "PLAYER 1 VENCEU!"
        );

    }

    if (
        player2.score >=
        WIN_SCORE
    ) {

        endGame(
            "PLAYER 2 VENCEU!"
        );

    }

}


function endGame(message) {

    gameRunning = false;

    overlayTitle.textContent =
        message;

    overlayText.textContent =
        `Placar final: ${player1.score} × ${player2.score}`;

    startButton.textContent =
        "JOGAR NOVAMENTE";

    overlay.classList.remove(
        "hidden"
    );

}


/* =========================
   DESENHO
========================= */

function drawBackground() {

    ctx.fillStyle =
        "#080c13";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    /* LINHA CENTRAL */

    ctx.setLineDash([
        8,
        12
    ]);

    ctx.strokeStyle =
        "#283241";

    ctx.lineWidth = 2;

    ctx.beginPath();

    ctx.moveTo(
        width / 2,
        0
    );

    ctx.lineTo(
        width / 2,
        height
    );

    ctx.stroke();

    ctx.setLineDash([]);


    /* PLACAR */

    const scoreSize =
        Math.max(
            40,
            width * .07
        );

    ctx.font =
        `bold ${scoreSize}px Arial`;

    ctx.textAlign =
        "center";

    ctx.fillStyle =
        "#202938";

    ctx.fillText(
        player1.score,
        width / 2 - 60,
        scoreSize + 10
    );

    ctx.fillText(
        player2.score,
        width / 2 + 60,
        scoreSize + 10
    );

}


/* =========================
   RAQUETE
========================= */

function drawPaddle(
    x,
    y
) {

    ctx.fillStyle =
        "#ffffff";

    ctx.beginPath();

    ctx.roundRect(
        x,
        y,
        paddle.width,
        paddle.height,
        6
    );

    ctx.fill();

}


/* =========================
   BOLA
========================= */

function drawBall() {

    ctx.fillStyle =
        "#ffffff";

    ctx.beginPath();

    ctx.arc(
        ball.x +
        ball.size / 2,

        ball.y +
        ball.size / 2,

        ball.size / 2,

        0,
        Math.PI * 2
    );

    ctx.fill();

}


/* =========================
   DRAW
========================= */

function draw() {

    drawBackground();

    drawPaddle(
        player1.x,
        player1.y
    );

    drawPaddle(
        player2.x,
        player2.y
    );

    drawBall();

}


/* =========================
   GAME LOOP
========================= */

function update() {

    if (
        gameRunning &&
        !gamePaused
    ) {

        updatePaddles();

        updateBall();

    }

    draw();

    requestAnimationFrame(
        update
    );

}


/* =========================
   START
========================= */

function startGame() {

    if (
        player1.score >= WIN_SCORE
        ||
        player2.score >= WIN_SCORE
    ) {

        player1.score = 0;

        player2.score = 0;

    }

    resetPositions();

    gameRunning = true;

    gamePaused = false;

    overlay.classList.add(
        "hidden"
    );

}


/* =========================
   RESTART
========================= */

function restartGame() {

    player1.score = 0;

    player2.score = 0;

    resetPositions();

    gameRunning = false;

    gamePaused = false;

    overlayTitle.textContent =
        "PONG";

    overlayText.textContent =
        "Primeiro jogador a chegar a 7 pontos vence.";

    startButton.textContent =
        "COMEÇAR";

    overlay.classList.remove(
        "hidden"
    );

}


/* =========================
   BOTÃO START
========================= */

startButton.addEventListener(
    "click",
    startGame
);


/* =========================
   INICIAR
========================= */

resizeCanvas();

resetPositions();

update();

</script>

</body>
</html>
